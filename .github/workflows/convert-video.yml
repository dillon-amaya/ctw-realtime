name: Convert AVI to MP4

on:
  push:
    paths:
      - 'ctw_animation_realtime.avi' # Triggers only when this specific file updates
  workflow_dispatch: # This adds a manual "Run Workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  convert_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert AVI to MP4
        # Uses standard web-safe encoding (H.264 video codec, YUV420P pixel format)
        run: ffmpeg -y -i ctw_animation_realtime.avi -c:v libx264 -pix_fmt yuv420p -movflags +faststart ctw_animation_realtime.mp4

      - name: Commit and Push MP4
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert AVI to MP4 for web playback"
          file_pattern: 'ctw_animation_realtime.mp4'
