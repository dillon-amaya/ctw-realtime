name: Convert AVI to MP4

on:
  push:
    paths:
      - 'ctw_animation_realtime.avi'
      - 'ctw_animation_ccs_realtime.avi'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert AVIs to MP4
        # The pipe symbol (|) allows running multiple commands in one step
        run: |
          ffmpeg -y -i ctw_animation_realtime.avi -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart ctw_animation_realtime.mp4
          ffmpeg -y -i ctw_animation_ccs_realtime.avi -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart ctw_animation_ccs_realtime.mp4
        
      - name: Commit and Push MP4s
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convert AVIs to MP4 for web playback"
          # Using a wildcard to grab both newly generated MP4 files
          file_pattern: '*.mp4'
